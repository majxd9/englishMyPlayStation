<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxford 3000 — خطة 50 كلمة أسبوعيًا</title>
<style>
/* ===== 1) الألوان والخطوط: ألوان هادئة للدراسة الطويلة + وضع داكن تلقائي ===== */
:root{--bg:#f4f3fb;--card:#fff;--ink:#1c1f3a;--mute:#666b90;--line:#dcdcf0;--pri:#4a4fd1;--pri2:#e6e7fb;--ok:#177a58;--ok2:#dcf3e8;--warn:#96520a;--warn2:#fdebd0;--shadow:0 6px 18px rgba(40,44,120,.12);--en:Georgia,"Times New Roman",serif}
@media(prefers-color-scheme:dark){:root{--bg:#12132b;--card:#1b1d3d;--ink:#e9eaff;--mute:#a0a5cf;--line:#2d3061;--pri:#9aa2ff;--pri2:#2a2d63;--ok:#5ee0a8;--ok2:#133a2e;--warn:#f2b866;--warn2:#3d2f18;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Segoe UI",Tahoma,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.in{animation:in .35s ease}                       /* حركة الانتقال بين الشاشات */
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1{font-size:1.45rem;line-height:1.4;margin:.3em 0}
h2{font-size:1.1rem;margin:1.5em 0 .6em}
small,.mute{color:var(--mute)}
.en{font-family:var(--en)}                        /* الإنكليزية بخط مختلف عن واجهة العربية */

/* ===== 2) الصفحة الرئيسية ===== */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chip{background:var(--pri2);color:var(--pri);border-radius:99px;padding:3px 12px;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:.9rem;color:var(--mute)}
.stat b{display:block;font-size:1.45rem;color:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--ok);transition:width .5s ease}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.wk{display:flex;flex-direction:column;gap:4px;min-height:132px;text-align:start;font:inherit;color:inherit;cursor:pointer;padding:14px;border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(to top,var(--ok2) var(--p,0%),var(--card) var(--p,0%));transition:transform .2s,box-shadow .2s,border-color .2s}
.wk:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--pri)}
.wk:active{transform:scale(.98)}
.wk.ghost{border-style:dashed;background:none;color:var(--mute);cursor:default}
.wk.ghost:hover{transform:none;box-shadow:none;border-color:var(--line)}
.wk b{font-size:1.05rem}
.tag{font-style:normal;font-size:.78rem;border-radius:99px;padding:1px 10px;align-self:flex-start;margin-top:auto}
.t0{background:var(--line);color:var(--mute)}.t1{background:var(--warn2);color:var(--warn)}.t2{background:var(--ok2);color:var(--ok);border:1px solid var(--ok)}

/* ===== 3) صفحة الأسبوع: الأزرار وقائمة الكلمات ===== */
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{background:var(--pri);color:var(--bg);border:1px solid var(--pri);border-radius:12px;padding:9px 16px;font:inherit;cursor:pointer;transition:background .2s,transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:var(--pri2);color:var(--pri)}
.btn.alt.on{background:var(--pri);color:var(--bg)}   /* الزر النشط */
.link{background:none;border:0;color:var(--pri);font:inherit;cursor:pointer;padding:6px 0}
/* زر الرجوع: كبسولة بسهم متحرك، يبقى ظاهرًا أعلى الصفحة أثناء التمرير */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px 0;background:var(--bg)}
.back{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:.95rem;color:var(--pri);background:var(--pri2);border:1px solid transparent;border-radius:99px;padding:7px 16px 7px 14px;cursor:pointer;transition:box-shadow .2s,border-color .2s,transform .15s}
.back i{font-style:normal;display:inline-block;transition:transform .2s}
.back:hover{box-shadow:var(--shadow);border-color:var(--pri)}
.back:hover i{transform:translateX(4px)}
.back:active{transform:scale(.97)}
ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
li{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;transition:background .25s,border-color .25s,transform .2s,box-shadow .2s}
li:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
li.on{background:var(--ok2);border-color:var(--ok)}
.top{display:flex;align-items:center;gap:10px}
.t{flex:1;min-width:0}
.t b{font-size:1.2rem}
.lv{font-size:.72rem;background:var(--pri2);color:var(--pri);border-radius:6px;padding:0 6px;margin-inline-start:6px}
.ar{color:var(--mute);max-width:42%;text-align:end}
.sn{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.ex{margin:0;flex:1;font-size:1.05rem}
.ar,.ex{transition:filter .25s}
.exb{flex:1;min-width:0}
.ea{direction:rtl;text-align:right;color:var(--mute);font-size:.95rem;margin:2px 0 0}   /* ترجمة الجملة */
.fc .ea,.qc .ea{text-align:center}
.hs .ex:not(.sh),.hm .ar:not(.sh){filter:blur(7px);cursor:pointer}   /* وضع اختبار الذاكرة: انقر للكشف */
.ic{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:var(--pri2);font-size:1.1rem;cursor:pointer;transition:transform .15s}
.ic:hover{transform:scale(1.1)}
.chk{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;cursor:pointer;font-size:1.1rem;transition:background .2s,border-color .2s}
li.on .chk{background:var(--ok);border-color:var(--ok);color:#fff}

/* ===== 4) بطاقات المراجعة ===== */
.fc{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px 16px;text-align:center;min-height:260px;cursor:pointer;transition:box-shadow .2s}
.fc:hover{box-shadow:var(--shadow)}
.big{font-size:2.3rem;font-weight:700}
.ans{font-size:1.6rem;margin:16px 0 6px;color:var(--pri)}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
mark{background:var(--warn2);color:inherit;border-radius:4px;padding:0 3px}   /* إبراز الكلمة داخل الجملة */
.ic.sm{width:34px;height:34px;font-size:.95rem}

/* ===== 5) الاختبار ===== */
.qc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 16px;text-align:center}
.qc .en{font-size:1.35rem;margin:10px 0 0}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{font-size:1.15rem;text-align:start;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s,transform .15s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--pri)}
.opt.good{background:var(--ok2);border-color:var(--ok)}.opt.good::before{content:"✓ "}
.opt.bad{background:var(--warn2);border-color:var(--warn)}.opt.bad::before{content:"✕ "}
.btn.done{background:var(--ok);border-color:var(--ok)}
.btn.done.on{background:var(--ok2);color:var(--ok)}
.qc .mk{font-size:2rem;letter-spacing:.15em;margin:12px 0 4px}
.qc .ic{margin-top:6px}
.inp{width:100%;font-family:var(--en);font-size:1.3rem;padding:12px 14px;margin-top:14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
.inp:focus{outline:none;border-color:var(--pri)}
.fbk{margin:10px 0 0;font-size:1.1rem}.fbk.good{color:var(--ok)}.fbk.bad{color:var(--warn)}

/* ===== 6) الطباعة / حفظ PDF: قائمة نظيفة بلا أزرار ===== */
@media print{
  :root{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#bbb;--pri:#000;--pri2:#eee;--ok2:#fff;--warn2:#eee;--shadow:none}
  body{background:#fff;font-size:13px}
  .row,.link,.nav,.bar,.ic,.chk,.tag,.ar a{display:none!important}
  .wrap{max-width:none;padding:0}
  ul{display:block}
  li{break-inside:avoid;box-shadow:none;border:0;border-bottom:1px solid #bbb;border-radius:0;padding:6px 0;background:#fff!important}
  .hs .ex,.hm .ar{filter:none!important}
}
@media(max-width:480px){.wrap{padding:12px}.ar{max-width:36%}.row .btn{flex:1 1 45%}}
</style>
</head>
<body>
<div id="app"></div>

   وداخل كل مستوى من الأقصر (الأبسط غالبًا) إلى الأطول. الكلمة التي لا معنى لها بعد تُكتب "كلمة|النوع|المستوى" فقط،

const PER=50;   // 50 كلمة في الأسبوع
// تحويل النصوص إلى مصفوفة كائنات: W[أسبوع][كلمة] = {en,pos,lv,ar,ex}
const W=WEEKS.map(w=>w.map(s=>{const[en,pos,lv,ar="",ex="",ea=""]=s.split("|");return{en,pos,lv,ar,ex,ea}}));
const N=W.length,TOTAL=W.reduce((a,w)=>a+w.length,0);   // عدد الأسابيع وعدد كل الكلمات
// المعنى العربي، أو رابط ترجمة إن لم يُضف بعد
const tr=x=>x.ar||`<a href="https://translate.google.com/?sl=en&tl=ar&text=${encodeURIComponent(x.en)}&op=translate" target="_blank" rel="noopener" onclick="event.stopPropagation()">ترجمة ↗</a>`;
// نطاق مستوى الأسبوع (مثل A1 أو A2–B1)
const lvr=i=>{const L=W[i].map(x=>x.lv);return L[0]==L[L.length-1]?L[0]:L[0]+"–"+L[L.length-1]};
// تعبير نمطي آمن لإبراز الكلمة داخل جملتها
const rx=x=>new RegExp("\\b"+x.en.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*","gi");

/* ===== قفل الأسابيع: الأسبوع 1 مفتوح دائمًا، ويُفتح كل أسبوع تالٍ يوم الأحد (بتوقيت جهاز كل شخص) =====
   START = يوم الأحد الذي يبدأ فيه الأسبوع 1 (سنة-شهر-يوم). غيّره لتغيير جدول الفتح (للتجربة ضعه في تاريخ قديم).
   ملاحظة: القفل داخل الصفحة ويعتمد على تاريخ الجهاز، فهو للتنظيم وليس حماية تامة. */
const START="2026-10-04";
const openAt=i=>{const[y,m,d]=START.split("-").map(Number);return new Date(y,m-1,d+7*i)};   // موعد فتح الأسبوع i (العدّ من 0)
const locked=i=>i>0&&Date.now()<openAt(i)&&!(S.passed&&S.passed[i-1]);   // يُفتح بالموعد، أو بنجاح اختبار الأسبوع السابق
const dstr=i=>openAt(i).toLocaleDateString("ar-u-nu-latn",{day:"numeric",month:"long"});

/* ===== 2) الحالة والتخزين المحلي (localStorage) ===== */
const K="ox3000_v2",LB=["لم يبدأ","قيد الدراسة","مكتمل"];
let S={learned:{},started:{}},cur=0,hs=false,hm=false,only=false,Q=[],qi=0,fl=false;
// hs: إخفاء الجمل | hm: إخفاء المعاني | Q/qi/fl: حالة بطاقات المراجعة
try{const o=JSON.parse(localStorage.getItem(K));if(o)S=o;else S.learned=JSON.parse(localStorage.getItem("ox3000_v1")).learned||{}}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const app=document.getElementById("app");
const cnt=i=>W[i].filter(x=>S.learned[x.en]).length;                      // عدد الكلمات المتعلَّمة
const st=i=>cnt(i)==W[i].length?2:(cnt(i)||S.started[i])?1:0;            // حالة الأسبوع
const tag=i=>`<i class="tag t${st(i)}">${LB[st(i)]}</i>`;

/* ===== 3) النطق (Web Speech API): الكلمة ثم الجملة، يعمل بدون إنترنت إن توفر صوت إنكليزي ===== */
function say(...parts){
  try{
    speechSynthesis.cancel();
    const v=speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));
    parts.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=S.slow?.6:.85;if(v)u.voice=v;speechSynthesis.speak(u)});
  }catch(e){}
}
const sayWord=(i,j)=>say(W[i][j].en);   // 🔊 الكلمة فقط
const saySent=(i,j)=>say(W[i][j].ex);   // 🔊 الجملة فقط
const shuf=a=>[...a].sort(()=>Math.random()-.5);   // خلط عشوائي
// إبراز الكلمة المستهدفة داخل الجملة (تلتقط التصريفات مثل gives)
const hl=x=>x.ex.replace(rx(x),"<mark>$&</mark>");

/* ===== 4) الصفحة الرئيسية ===== */
function home(){
  const L=W.reduce((a,_,i)=>a+cnt(i),0),f=W.findIndex((_,i)=>!locked(i)&&st(i)<2),lo=W.filter((_,i)=>!locked(i)).length,c=f<0?lo-1:f,p=(L/TOTAL*100).toFixed(1);
  let g="";
  for(let i=0;i<N;i++)g+=!locked(i)
    ?`<button class="wk" style="--p:${cnt(i)/W[i].length*100}%" onclick="week(${i})"><b>الأسبوع ${i+1}</b><span>${W[i].length} كلمة</span><small dir="ltr">${lvr(i)}</small><small>${cnt(i)} من ${W[i].length}</small>${tag(i)}</button>`
    :`<div class="wk ghost"><b>🔒 الأسبوع ${i+1}</b><span>${W[i].length} كلمة</span><small>يُفتح الأحد ${dstr(i)}</small><small>بعد ${Math.ceil((openAt(i)-Date.now())/864e5)} يوم</small>${i==lo?`<small>أو بنجاحك في اختبار الأسبوع ${i}</small>`:""}</div>`;
  app.innerHTML=`<div class="wrap in"><h1>Oxford 3000 — خطة 50 كلمة أسبوعيًا</h1>
  <div class="chips"><span class="chip">مستوانا: A2</span><span class="chip">الخطة: 50 كلمة كل أسبوع</span><span class="chip">${N} أسبوعًا</span>${lo<N?`<span class="chip">الأسبوع القادم: الأحد ${dstr(lo)}</span>`:""}</div>
  <div class="stats"><div class="stat">الأسبوع الحالي<b>${c+1}</b></div><div class="stat">نسبة الإنجاز<b>${p}%</b></div>
  <div class="stat">كلمات تعلمناها<b>${L}</b></div><div class="stat">الكلمات المتبقية<b>${TOTAL-L}</b></div></div>
  <div class="bar"><i style="width:${p}%"></i></div>
  <h2>الأسابيع</h2><div class="grid">${g}</div>
  <p><small>الكلمات من قائمة Oxford 3000، مرتبة من الأسهل والأكثر استعمالًا في الحياة والدراسة إلى الأصعب. يُفتح أسبوع جديد كل يوم أحد، أو فور نجاحك في اختبار الأسبوع السابق.</small> </p><p><small>تقدمك محفوظ تلقائيًا في هذا المتصفح وعلى هذا الجهاز فقط. للنقل إلى جهاز آخر استخدم النسخ الاحتياطي.</small></p>
  <div class="row"><button class="btn alt" onclick="backup()">نسخ احتياطي للتقدم</button><button class="btn alt" onclick="restore()">استرجاع التقدم</button><button class="link" onclick="resetAll()">إعادة ضبط التقدم</button></div></div>`;
  scrollTo(0,0);
}

/* ===== 5) صفحة الأسبوع: تُرسم ديناميكيًا من مصفوفة البيانات ===== */
function week(i,keep){
  if(locked(i))return home();   // أسبوع مقفل
  cur=i;if(!st(i)){S.started[i]=1;save()}
  const w=W[i];
  app.innerHTML=`<div class="wrap${keep?"":" in"}"><div class="nav"><button class="back" onclick="home()"><i>→</i> رجوع إلى الأسابيع</button></div>
  <h1>الأسبوع ${i+1} ${tag(i)}</h1><small>تعلمنا ${cnt(i)} من ${w.length} كلمة</small>
  <div class="bar"><i style="width:${cnt(i)/w.length*100}%"></i></div>
  <div class="row"><button class="btn" onclick="cards(${i})">بطاقات المراجعة</button><button class="btn" onclick="quiz(${i})">اختبار الأسبوع</button><button class="btn" onclick="spell(${i})">اختبار الإملاء</button><button class="btn alt" onclick="pdf(${i})">حفظ الأسبوع PDF</button></div>
  <div class="row"><button class="btn done${cnt(i)==w.length?" on":""}" onclick="finish(${i})">${cnt(i)==w.length?"إلغاء إتمام الأسبوع":"✓ إتمام مهمة الأسبوع"}</button></div>
  <div class="row">
  <button class="btn alt${hs?" on":""}" aria-pressed="${hs}" onclick="hs=true;week(${i},1)">إخفاء الجمل</button>
  <button class="btn alt${hs?"":" on"}" aria-pressed="${!hs}" onclick="hs=false;week(${i},1)">إظهار الجمل</button>
  <button class="btn alt${hm?" on":""}" aria-pressed="${hm}" onclick="hm=!hm;week(${i},1)">${hm?"إظهار المعاني":"إخفاء المعاني"}</button>
  <button class="btn alt${S.slow?" on":""}" aria-pressed="${!!S.slow}" onclick="S.slow=!S.slow;save();week(${i},1)">🐢 نطق بطيء</button>
  <button class="btn alt${only?" on":""}" aria-pressed="${only}" onclick="only=!only;week(${i},1)">غير المتعلَّمة فقط</button></div>
  <ul class="${hs?"hs ":""}${hm?"hm":""}">${w.map((x,j)=>only&&S.learned[x.en]?"":`<li class="${S.learned[x.en]?"on":""}">
  <div class="top"><button class="ic" aria-label="نطق الكلمة" onclick="sayWord(${i},${j})">🔊</button><div class="t"><b class="en" dir="ltr">${x.en}</b><br><small dir="ltr">${x.pos}<span class="lv">${x.lv}</span></small></div>
  <span class="ar" onclick="this.classList.toggle('sh')">${tr(x)}</span>
  <button class="chk" aria-label="تعلمتها" onclick="tg(${i},${j})">✓</button></div>
  ${x.ex?`<div class="sn" dir="ltr"><button class="ic sm" aria-label="نطق الجملة" onclick="saySent(${i},${j})">🔊</button>
  <div class="exb"><p class="ex en" onclick="this.classList.toggle('sh')">${hl(x)}</p>${x.ea?`<p class="ex ea" onclick="this.classList.toggle('sh')">${x.ea}</p>`:""}</div></div>`:""}</li>`).join("")}</ul>${only&&cnt(i)==w.length?`<p class="mute">أحسنت! كل كلمات الأسبوع متعلَّمة.</p>`:""}</div>`;
  if(!keep)scrollTo(0,0);
}

// إتمام مهمة الأسبوع بضغطة واحدة: يعلّم كل كلماته كمتعلَّمة (والضغط مرة أخرى يلغي ذلك)
function finish(i){
  const all=cnt(i)==W[i].length;
  W[i].forEach(x=>{if(all)delete S.learned[x.en];else S.learned[x.en]=1});
  save();week(i,1);
}
// تبديل حالة "تعلمتها" لكلمة
function tg(i,j){const k=W[i][j].en;if(S.learned[k])delete S.learned[k];else S.learned[k]=1;save();week(i,1)}

/* ===== 6) بطاقات المراجعة ===== */
function cards(i){
  cur=i;Q=W[i].map((_,j)=>j).filter(j=>!S.learned[W[i][j].en]);   // غير المتعلَّمة أولًا
  if(!Q.length)Q=W[i].map((_,j)=>j);
  Q=shuf(Q);   // ترتيب عشوائي
  qi=0;fl=false;card();
}
function card(keep){
  const i=cur;
  if(qi>=Q.length){app.innerHTML=`<div class="wrap in"><h1>انتهت الجولة</h1><p>تعلمنا ${cnt(i)} من ${W[i].length} في هذا الأسبوع.</p><div class="row"><button class="btn" onclick="week(${i})">العودة إلى الأسبوع</button><button class="btn alt" onclick="cards(${i})">جولة جديدة</button></div></div>`;return}
  const j=Q[qi],x=W[i][j];
  app.innerHTML=`<div class="wrap${keep?"":" in"}"><div class="nav"><button class="back" onclick="week(${i})"><i>→</i> رجوع</button></div><p class="mute">المتبقي: ${Q.length-qi}</p>
  <div class="fc" onclick="fl=!fl;card(1)"><div class="en big" dir="ltr">${x.en}</div><small dir="ltr">${x.pos}<span class="lv">${x.lv}</span></small>
  ${fl?`<div class="ans">${tr(x)}</div>${x.ex?`<p class="en" dir="ltr">${hl(x)}</p>${x.ea?`<p class="ea">${x.ea}</p>`:""}`:""}`:`<p class="mute">اضغط لإظهار المعنى والجملة</p>`}</div>
  <div class="row"><button class="btn alt" onclick="sayWord(${i},${j})">🔊 الكلمة</button><button class="btn alt" onclick="saySent(${i},${j})">🔊 الجملة</button><button class="btn alt" onclick="nx(0)">لاحقًا</button><button class="btn" onclick="nx(1)">عرفتها</button></div></div>`;
}
function nx(k){if(k){S.learned[W[cur][Q[qi]].en]=1;save()}else Q.push(Q[qi]);qi++;fl=false;card()}   // "لاحقًا": تعود البطاقة في آخر الجولة

/* ===== 7) اختبار الأسبوع: سؤال معنى (عربي ← إنكليزي) أو إكمال جملة، بخيارات عشوائية ===== */
let QZ=[],qn=0,sc=0,miss=[],sp=false,qfull=true;   // sp: اختبار إملاء | qfull: اختبار كامل (وليس إعادة الأخطاء فقط)
// نسبة النجاح المطلوبة في اختبار كامل لفتح الأسبوع التالي مبكرًا (0.7 = 70%)
const PASS=.7;
function mark(i,sc,n){   // يسجّل النجاح ويرجع رسالة تظهر في شاشة النتيجة
  if(sc/n<PASS)return `<p class="mute">تحتاج ${Math.round(PASS*100)}% على الأقل لفتح الأسبوع التالي مبكرًا.</p>`;
  const was=i+1<N&&locked(i+1);
  (S.passed=S.passed||{})[i]=1;save();
  return was?`<p>🎉 نجحت! فُتح الأسبوع ${i+2}.</p>`:"";
}
function quiz(i,ids,m){   // m=true: اختبار إملاء
  cur=i;sp=!!m;qfull=!ids;
  QZ=shuf(ids||W[i].map((_,j)=>j).filter(j=>W[i][j].ar&&(!sp||/[A-Za-z].*[A-Za-z]/.test(W[i][j].en))));
  if(QZ.length<4)return alert("الاختبار يتوفر عندما تُضاف معاني هذا الأسبوع.");
  qn=0;sc=0;miss=[];qz();
}
const spell=(i,ids)=>quiz(i,ids,true);
/* ===== اختبار الإملاء: المعنى + الكلمة ناقصة الأحرف، والمطلوب كتابتها كاملة ===== */
function mask(w){   // يخفي نحو 40% من الأحرف (الحرف الأول يبقى) ويعرضها كـ _
  const ix=[...w].map((c,k)=>k).filter(k=>k>0&&/[A-Za-z]/.test(w[k]));
  const hide=new Set(shuf(ix).slice(0,Math.max(1,Math.round(ix.length*.4))));
  return [...w].map((c,k)=>hide.has(k)?"_":c).join(" ");
}
const nz=s=>s.toLowerCase().replace(/’/g,"'").replace(/\s+/g," ").trim();
function sq(j){
  const i=cur,x=W[i][j];
  app.innerHTML=`<div class="wrap${qn?"":" in"}"><div class="nav"><button class="back" onclick="week(${i})"><i>→</i> إنهاء الاختبار</button></div><p class="mute">السؤال ${qn+1} من ${QZ.length}</p>
  <div class="qc"><small>أكمل الكلمة الناقصة واكتبها كاملة</small><div class="ans">${x.ar}</div><p class="en mk" dir="ltr">${mask(x.en)}</p>
  <button class="ic" aria-label="نطق الكلمة" onclick="sayWord(${i},${j})">🔊</button></div>
  <input id="sa" class="inp" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="اكتب الكلمة كاملة" onkeydown="if(event.key=='Enter')spCheck(${j})">
  <div id="fb"></div>
  <div class="row"><button class="btn" id="chk" onclick="spCheck(${j})">تحقق</button><button class="btn" id="nxq" hidden onclick="qn++;qz()">${qn+1==QZ.length?"عرض النتيجة":"التالي"}</button></div></div>`;
  document.getElementById("sa").focus();
}
function spCheck(j){
  const x=W[cur][j],inp=document.getElementById("sa");
  if(!inp.value.trim())return;
  const ok=nz(inp.value)==nz(x.en);
  if(ok)sc++;else miss.push(j);
  inp.disabled=true;
  document.getElementById("fb").innerHTML=ok?`<p class="fbk good">✓ صحيح</p>`:`<p class="fbk bad">✕ الصحيح: <b class="en" dir="ltr">${x.en}</b></p>`;
  document.getElementById("chk").hidden=true;
  const n=document.getElementById("nxq");n.hidden=false;n.focus();
}
function qz(){
  const i=cur,w=W[i];
  if(qn>=QZ.length){   // شاشة النتيجة
    app.innerHTML=`<div class="wrap in"><div class="nav"><button class="back" onclick="week(${i})"><i>→</i> رجوع إلى الأسبوع</button></div><h1>نتيجة الاختبار</h1><p class="big" dir="ltr">${sc} / ${QZ.length}</p>${qfull?mark(i,sc,QZ.length):""}
    ${miss.length?`<p class="mute">كلمات تحتاج مراجعة:</p><p class="en" dir="ltr">${miss.map(j=>w[j].en).join(", ")}</p>`:`<p>ممتاز! كل الإجابات صحيحة.</p>`}
    <div class="row">${miss.length?`<button class="btn" onclick="quiz(${i},[${miss}],${sp})">أعد الأخطاء فقط</button>`:""}<button class="btn alt" onclick="quiz(${i},0,${sp})">اختبار جديد</button></div></div>`;return}
  if(sp)return sq(QZ[qn]);
  const j=QZ[qn],x=w[j],re=rx(x),cz=x.ex.search(re)>=0&&Math.random()<.5;   // cz: سؤال إكمال جملة
  const o=shuf([j,...shuf(w.map((_,k)=>k).filter(k=>k!=j)).slice(0,3)]);
  app.innerHTML=`<div class="wrap${qn?"":" in"}"><div class="nav"><button class="back" onclick="week(${i})"><i>→</i> إنهاء الاختبار</button></div><p class="mute">السؤال ${qn+1} من ${QZ.length}</p>
  <div class="qc">${cz?`<small>اختر الكلمة المناسبة للفراغ</small><p class="en" dir="ltr">${x.ex.replace(re,"_____")}</p>${x.ea?`<p class="ea">${x.ea}</p>`:""}`:`<small>ما الكلمة الإنكليزية لهذا المعنى؟</small><div class="ans">${x.ar}</div>`}</div>
  <div class="opts">${o.map(k=>`<button class="opt en" dir="ltr" data-k="${k}" onclick="pick(this,${k},${j})">${w[k].en}</button>`).join("")}</div>
  <div class="row"><button class="btn" id="nxq" hidden onclick="qn++;qz()">${qn+1==QZ.length?"عرض النتيجة":"التالي"}</button></div></div>`;
}
// الإجابة: تلوين الصحيحة والخاطئة ثم إظهار زر التالي
function pick(b,k,j){
  if(k==j)sc++;else{miss.push(j);b.classList.add("bad")}
  document.querySelectorAll(".opt").forEach(e=>{e.disabled=true;if(+e.dataset.k==j)e.classList.add("good")});
  document.getElementById("nxq").hidden=false;
}
// حفظ كلمات الأسبوع كملف PDF: تفتح نافذة الطباعة فاختر "حفظ كـ PDF" (تُخفى أزرار الصفحة تلقائيًا)
function pdf(i){const t=document.title;document.title="Oxford3000-Week-"+(i+1);window.print();document.title=t}
// إعادة ضبط كل التقدم
function resetAll(){if(confirm("سيتم مسح كل التقدم. هل أنت متأكد؟")){S={learned:{},started:{}};save();home()}}

/* ===== 8) نسخ احتياطي: كود نصي ينقل التقدم بين الأجهزة والمتصفحات، والاسترجاع يدمج ولا يمسح شيئًا ===== */
function backup(){
  const c=btoa(JSON.stringify(S));
  const fb=()=>prompt("انسخ هذا الكود واحفظه:",c);
  try{navigator.clipboard.writeText(c).then(()=>alert("تم نسخ كود التقدم. احفظه في ملاحظاتك."),fb)}catch(e){fb()}
}
function restore(){
  const c=prompt("الصق كود التقدم هنا:");if(!c)return;
  try{
    const o=JSON.parse(atob(c.trim()));if(!o.learned)throw 0;
    S.learned={...S.learned,...o.learned};S.started={...S.started,...o.started};S.passed={...S.passed,...o.passed};save();home();alert("تم استرجاع التقدم.");
  }catch(e){alert("الكود غير صالح.")}
}

home();
</script>
